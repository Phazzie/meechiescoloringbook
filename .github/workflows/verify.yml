# Purpose: Enforce Seam-Driven Development gates in CI.
# Why: Prevent unverified changes from landing in main.
# Info flow: push/PR -> npm run verify + npx playwright test -> pass/fail.
#
# The `e2e` job exists because `AGENTS.md`'s worst-feature routine requires `npx playwright test`
# for any user-facing change, and that command ran **nowhere**: the sandboxed containers those
# scheduled runs execute in have Chromium build 1194 while `@playwright/test` pins 1208, and
# `npx playwright install` is refused by the network policy there. Every run since the requirement
# was written has recorded the gate as unmet and carried it forward. A runner can install the pinned
# build, so this is where the gate can actually exist.
name: verify

on:
  push:
  pull_request:

# Least privilege, stated rather than inherited. Without this key both jobs run with whatever the
# repository's default token scope happens to be, which for many repositories is write. Neither job
# does anything but read the checkout and run npm.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify
        run: npm run verify

  # Separate from `verify` on purpose: a browser install is slow and this must not delay the
  # unit/contract gate, and a red e2e run should name itself rather than arriving as "verify failed".
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # `npm ci --ignore-scripts`, not `npm install`. SonarCloud failed this pull request's quality
      # gate on the first draft of this job, which used `npm install` and then `npx`: dependencies
      # resolved without the lockfile, lifecycle scripts run during installation, and `npx`
      # fetching a package on demand at an unpinned version. All three are supply-chain surface on
      # the one job that installs a browser, so all three are gone rather than waived.
      #
      # `--ignore-scripts` skips `prepare` (`svelte-kit sync`), which this job does not need: the
      # Playwright web server runs `npm run dev`, and the SvelteKit Vite plugin syncs there. It also
      # skips Playwright's own postinstall browser download, which the next step does explicitly and
      # pinned.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Both steps run the `playwright` binary `npm ci` just installed at the version the lockfile
      # pins, through package scripts rather than `npx`, which resolves and can fetch on its own.
      #
      # `npm run test:e2e` is `playwright test` against `playwright.config.ts` — the pinned browser
      # build — and deliberately not `playwright.local.config.ts`, whose whole purpose is to run
      # against whatever Chromium a sandbox happens to have. Substituting that here would make CI
      # agree with the sandbox instead of holding the line it exists to hold.
      - name: Install the pinned browser
        run: npm run playwright:install
      - name: End-to-end
        run: npm run test:e2e
      # Both directories, because they carry different things and only one of them used to exist.
      # `playwright-report/` is written by the HTML reporter that `playwright.config.ts` now declares
      # — before it did, this step uploaded a directory nothing created. `test-results/` is where
      # Playwright puts a failed test's own error context, and it is written whatever the reporter is.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
